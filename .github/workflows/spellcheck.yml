# Spellcheck the package prose (DESCRIPTION, man/*.Rd, README, NEWS).
# Reference: https://morrison-lab.github.io/gha/reference/spellcheck.html
name: Spellcheck

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: spellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck:
    uses: Morrison-Lab/gha/.github/workflows/spellcheck.yml@v2
